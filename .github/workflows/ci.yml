name: CI

on:
  pull_request:
    branches: [development, staging, production]
  push:
    branches: [development, staging, production, main]

env:
  VITE_ANCLORA_NEXUS_LOGIN_URL: "http://localhost:3000/login"
  VITE_ANCLORA_PRIVATE_AREA_URL: "http://localhost:3000"
  VITE_CONTACT_CAPTCHA_PROVIDER: "none"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
